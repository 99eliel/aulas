<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Guia de Aulas • Informática Básica</title><style>:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#687386;--line:#e3e8f0;--accent:#2563eb;--ok:#15803d}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{background:#111827;color:white;padding:22px}header h1{margin:0 0 4px;font-size:24px}.wrap{max-width:1150px;margin:auto;padding:20px}.toolbar,.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button,a.btn,input,select,textarea{font:inherit}button,a.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;background:var(--accent);color:#fff}.ghost{background:#e8eef9!important;color:#1e3a5f!important}.danger{background:#b91c1c!important}.stats .box{background:white;border:1px solid var(--line);border-radius:12px;padding:12px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 3px 12px #1f29370b}.card.done{border-color:#86efac}.tag{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700}.card h3{margin:7px 0}.card p{color:var(--muted);min-height:42px}.progress{height:7px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--ok)}dialog{width:min(850px,94vw);border:0;border-radius:18px;padding:0;box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0f172a99}.modal{padding:22px}.modal h2{margin-top:0}.timeline{border-left:3px solid #dbeafe;margin:18px 0;padding-left:18px}.step{margin:0 0 18px}.step b{display:block}.step small{color:var(--muted)}.check{display:flex;gap:9px;align-items:flex-start;padding:8px 0}.note{width:100%;min-height:100px;border:1px solid var(--line);border-radius:10px;padding:10px}.timer{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.students{width:100%;border-collapse:collapse;margin-top:10px}.students th,.students td{border-bottom:1px solid var(--line);padding:8px;text-align:left}.students input{width:90px;padding:6px;border:1px solid var(--line);border-radius:7px}@media(max-width:600px){.wrap{padding:12px}.students{font-size:12px}.students input{width:64px}}</style></head><body><header><div class="wrap" style="padding:0"><h1>Guia de Aulas • Informática Básica</h1><div>20 encontros • 30 horas • roteiro do professor</div></div></header><main class="wrap"><div class="toolbar"><button onclick="showLessons()">Aulas</button><button class="ghost" onclick="showTyping()">Digitação</button><a class="btn ghost" href="https://www.typingclub.com/" target="_blank">Abrir TypingClub ↗</a><button class="ghost" onclick="resetAll()">Nova turma / limpar progresso</button></div><div class="stats"><div class="box"><b id="doneCount">0/20</b><br><small>Aulas concluídas</small></div><div class="box"><b id="pct">0%</b><br><small>Progresso</small></div><div class="box"><b id="next">Aula 1</b><br><small>Próxima aula</small></div></div><section id="content"></section></main><dialog id="lessonDialog"><div class="modal" id="modalBody"></div></dialog><script src="app.js"></script></body></html>
